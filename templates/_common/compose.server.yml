# Server instance: sits behind nginx-proxy/acme-companion (see
# server/proxy), named volumes instead of bind mounts, no published ports.
#
# DB_PASSWORD is generated by instance-new and written to the instance's
# .env; it is never hardcoded here. The official odoo image's entrypoint
# reads HOST/USER/PASSWORD and passes them as --db_host/--db_user/
# --db_password, since config/odoo.conf deliberately leaves those unset
# (see instance-new: an uncommented db_password in the config file would
# take precedence over these and silently ignore DB_PASSWORD).
services:
  web:
    restart: always
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=${DB_PASSWORD}
      - VIRTUAL_HOST=${DOMAIN}
      - VIRTUAL_PORT=8069
      - LETSENCRYPT_HOST=${DOMAIN}
      - LETSENCRYPT_EMAIL=${CONTACT}
    volumes:
      - extra-addons:/mnt/extra-addons
    networks:
      - nginx-proxy

  db:
    restart: always
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}

volumes:
  extra-addons:

networks:
  nginx-proxy:
    external: true
